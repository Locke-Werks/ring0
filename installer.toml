# ring0: a GPU-rendered Windows task manager.
#
# Payload is the Qt deployment produced by `cmake --install` (windeployqt):
# ring0.exe plus the Qt runtime beside it.

[product]
name         = "ring0"
version      = "0.2.2"
publisher    = "Locke Werks"
description  = "Native Windows task manager, rendered on the GPU."
copyright    = "Copyright (c) 2026 Locke Werks. GPL-3.0-or-later."
url          = "https://github.com/Locke-Werks/ring0"
# Same file the exe resource and the README header use.
icon         = "assets/ring0.ico"
# Stable across versions forever: upgrade detection and the single-instance
# mutex key off it.
upgrade_code = "8f3c2a71-5d4e-4b9a-a6c2-1e7f0d93b4a8"
aumid        = "LockeWerks.ring0"

[install]
scope     = "machine"
dir       = '{ProgramFiles}\ring0'
elevation = "required"

# Windows 11 24H2. Not cosmetic: ring0 elevates itself through sudo for
# Windows, which does not exist before this build.
[[preflight]]
type = "os_build"
min  = 26100
fail = "Windows 11 24H2 (build 26100) or later is required. ring0 elevates itself through sudo for Windows, which older builds do not have."

# Catches the out-of-box state, where sudo has never been configured and the
# key does not exist. registry_value only tests presence, so a machine in
# ForceNewWindow or DisableInput mode passes here; ring0 checks the actual mode
# at launch and refuses with the exact fix, which is the real gate.
[[preflight]]
type   = "registry_value"
hive   = "HKLM"
key    = 'SOFTWARE\Microsoft\Windows\CurrentVersion\Sudo'
name   = "Enabled"
expect = true
fail   = "sudo for Windows is not enabled. ring0 needs it in Inline mode. Open an administrator terminal and run: sudo config --enable normal"

# Replacing the files under a running copy fails the copy halfway.
[[preflight]]
type            = "process_not_running"
name            = "ring0.exe"
restart_manager = true
fail            = "ring0 is running. Close it and try again."

[ui]
license_text = """
ring0 is free software: you can redistribute it and/or modify it under the
terms of the GNU General Public License as published by the Free Software
Foundation, either version 3 of the License, or (at your option) any later
version.

ring0 is distributed in the hope that it will be useful, but WITHOUT ANY
WARRANTY; without even the implied warranty of MERCHANTABILITY or FITNESS FOR A
PARTICULAR PURPOSE. See the GNU General Public License for more details:
https://www.gnu.org/licenses/gpl-3.0.html

The bundled PawnIO modules are LGPL-2.1; the PawnIO driver is GPL-2.0 with an
IOCTL exception. Both are by namazso, https://pawnio.eu
"""

# CPU temperature, package power, effective clocks and DDR5 module temperatures
# need a kernel driver. PawnIO is signed and open source, and shared with
# LibreHardwareMonitor and others, so it is offered rather than forced.
[[options]]
id      = "pawnio"
label   = "Install the PawnIO driver for CPU and memory sensors"
detail  = "Adds a signed kernel driver from pawnio.eu. Without it, temperatures, power and clocks are not shown; everything else works."
default = true

[[options]]
id      = "replace_taskmgr"
label   = "Use ring0 as the Task Manager (Ctrl+Shift+Esc, Ctrl+Alt+Del, taskbar menu)"
detail  = "Sets the Image File Execution Options Debugger value on taskmgr.exe, as Process Explorer does. EDR and antivirus products watch that key because malware abuses it; yours may raise an alert or block the change. Uninstalling ring0 restores the stock Task Manager."
default = true

[[actions]]
type = "arp"

# Windows launches the Debugger with the original taskmgr command line appended,
# so the value is quoted (Program Files has a space) and ring0 ignores the extra
# arguments. Forge captures the prior state and restores it on uninstall.
[[actions]]
type       = "registry_write"
when       = "replace_taskmgr"
hive       = "HKLM"
key        = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\taskmgr.exe'
name       = "Debugger"
value      = '"{InstallDir}\ring0.exe"'
value_type = "sz"

[[actions]]
type   = "shortcut"
target = '{InstallDir}\ring0.exe'
name   = "ring0"

# Not vital: ring0 runs without the driver, and an existing PawnIO install makes
# the setup refuse, which is not a failure of this install. -silent shows no UI
# even on error, so an unattended deployment never stalls here.
[[hooks.post_install]]
id          = "install_pawnio"
when        = "pawnio"
run         = 'payload:PawnIO_setup.exe'
args        = ["-install", "-silent"]
as          = "installer"
sha256      = "auto"
expect_exit = [0, 3010]
timeout_ms  = 180000
vital       = false

# PawnIO is deliberately left installed on uninstall: other tools share it.
